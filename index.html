<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F90 | المركز الرسمي للعمليات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flag-ribbon top"></div>
  <div class="app-container">
    <header class="main-header">
      <div class="brand">
        <span class="logo">F90</span>
        <h1>موقع F90 الرسمي</h1>
      </div>
      <nav class="social-nav">
        <a href="https://wa.me/970568181910" target="_blank">واتساب: 970568181910+</a>
        <a href="https://instagram.com/f90.xd" target="_blank">إنستغرام: f90.xd</a>
      </nav>
      <button id="themeToggle">تبديل المظهر</button>
    </header>

    <main>
      <!-- VIP Calculator -->
      <section id="vip" class="card">
        <h2>حاسبة VIP الكاملة</h2>
        <div class="vip-controls">
          <input type="number" id="vipPoints" placeholder="نقاط الـ VIP">
          <input type="number" id="vipMultiplier" placeholder="المضاعف">
          <select id="vipType">
            <option value="none">بدون تثبيت</option>
            <option value="maintain">تثبيت (Maintain)</option>
          </select>
          <button onclick="calculateVIP()">حساب</button>
        </div>
        <div id="vipResult" class="result">النتيجة: —</div>
      </section>

      <!-- All Other Calculators -->
      <section class="grid-tools">
        <!-- Template structure for a calculator card (will be generated in JS) -->
      </section>

      <!-- Subscription Cards -->
      <section class="subscription-section">
        <div class="sub-card">
          <h3>اشتراك شهري</h3>
          <p>25$</p>
          <a href="https://wa.me/970568181910?text=أريد الاشتراك شهرياً بـ 25$" class="btn">اشترك الآن</a>
        </div>
        <div class="sub-card">
          <h3>امتلاك الموقع</h3>
          <p>100$</p>
          <a href="https://wa.me/970568181910?text=أريد شراء الموقع بـ 100$" class="btn">اطلب الموقع</a>
        </div>
      </section>

      <!-- History -->
      <section id="history" class="card">
        <h2>سجل العمليات</h2>
        <button onclick="clearHistory()">مسح السجل</button>
        <div id="historyList"></div>
      </section>
    </main>
  </div>
  <div class="flag-ribbon bottom"></div>
  <script src="script.js"></script>
</body>
</html>
